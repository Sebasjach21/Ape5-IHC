<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aula Abierta · Boceto A</title>
  <style>
    body { width: 960px; margin: 0; font: 18px Arial, sans-serif; color: #243b4a; }
    header, article, aside { border: 2px dashed #89979c; padding: 18px; }
    header { margin: 40px 0 34px; }
    h1 { margin: 0 0 32px; font-size: 36px; }
    h2 { margin-top: 30px; font-size: 26px; }
    .columnas { display: grid; grid-template-columns: 580px 360px; gap: 20px; }
    article, aside { min-height: 165px; box-sizing: border-box; }
    button { padding: 8px; font: inherit; }
  </style>
</head>
<body>
  <header>AULA ABIERTA · Boceto A de escritorio</header>
  <main>
    <h1>Elige tu taller</h1>
    <div class="columnas">
      <article>
        <h2>Interfaces web accesibles</h2>
        <p>Jueves · 14:00 a 16:00 · Laboratorio 2</p>
        <button type="button" disabled>Reservar un lugar</button>
      </article>
      <aside>
        <h2>Mi reserva</h2>
        <p>Aún no tienes una reserva.</p>
      </aside>
    </div>
    <p>Boceto estático para discutir jerarquía, ancho fijo y ubicación de la reserva.</p>
  </main>
</body>
</html>
